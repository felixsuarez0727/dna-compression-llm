name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.10 on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Install test dependencies
        run: uv sync --locked --group test

      - name: Run test suite
        run: uv run --locked --group test pytest

      - name: Build package
        run: uv build